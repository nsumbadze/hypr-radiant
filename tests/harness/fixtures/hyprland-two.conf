# Two-headless fixture for multi-monitor hypr-radiant audit (behavior 12).
# Two headless outputs, workspaces split across monitors.

monitor = HEADLESS-1, 1920x1080@60, 0x0, 1
monitor = HEADLESS-2, 1920x1080@60, 1920x0, 1

workspace = 1, default:true, monitor:HEADLESS-1
workspace = 2, monitor:HEADLESS-1
workspace = 3, monitor:HEADLESS-2
workspace = 4, monitor:HEADLESS-2

# One terminal on each monitor
exec-once = [workspace 2] alacritty -e sleep inf
exec-once = [workspace 4] alacritty -e sleep inf

debug {
    disable_logs = false
}
