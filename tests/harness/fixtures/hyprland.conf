# Headless Hyprland fixture for hypr-radiant audit harness.
# This config is intentionally minimal: one headless output, three workspaces,
# and two long-lived terminal windows placed on workspaces 2 and 3.

monitor = HEADLESS-1, 1920x1080@60, 0x0, 1

workspace = 1, default:true
workspace = 2
workspace = 3

# Place one terminal window on workspace 2 and another on workspace 3.
# If alacritty is unavailable, the exec silently fails; the harness still
# validates radiant:toggle via the overlay and grim screenshots.
exec-once = [workspace 2] alacritty -e sleep inf
exec-once = [workspace 3] alacritty -e sleep inf

# Keep logging enabled so the plugin's "radiant overlay opened" line is captured.
debug {
    disable_logs = false
}
