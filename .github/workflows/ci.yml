name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  logic:
    name: Pure logic validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      CLANG_FORMAT: clang-format-22
      CLANG_TIDY: clang-tidy-22
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      PURE_TIDY_FILES: >-
        src/overview/WorkspaceWallLayout.cpp
        src/overview/SearchPanelGeometry.cpp
        src/overview/HitTester.cpp
        src/overview/SearchMatcher.cpp
        src/render/FadeAnimation.cpp
        src/input/SwipeTracker.cpp
        src/input/OpeningInputGuard.cpp
        src/overview/AppIdentity.cpp
        src/overview/StageTransform.cpp
        src/overview/OverlayGeometry.cpp
        tests/WorkspaceWallLayoutTest.cpp
        tests/OverlayGeometryTest.cpp
        tests/HitTesterTest.cpp
        tests/SearchMatcherTest.cpp
        tests/FadeAnimationTest.cpp
        tests/GestureControllerTest.cpp
        tests/OpeningInputGuardTest.cpp
        tests/AppIdentityTest.cpp
        tests/StageTransformTest.cpp
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            cmake \
            g++ \
            pkg-config \
            wget
          wget --quiet https://apt.llvm.org/llvm.sh --output-document=/tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y --no-install-recommends \
            clang-format-22 \
            clang-tidy-22

      - name: Report validation toolchain
        run: |
          "$CLANG_FORMAT" --version
          "$CLANG_TIDY" --version

      - name: Validate formatter configuration
        run: |
          "$CLANG_FORMAT" --dump-config > /dev/null

      - name: Check formatting
        run: |
          "$CLANG_FORMAT" --dry-run -Werror $(git ls-files '*.cpp' '*.hpp')

      - name: Build and run pure logic tests
        run: |
          cmake -S . -B build/ci-logic \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DHYPR_RADIANT_BUILD_PLUGIN=OFF \
            -DHYPR_RADIANT_ENABLE_SANITIZERS=ON \
            -DHYPR_RADIANT_WARNINGS_AS_ERRORS=ON
          cmake --build build/ci-logic --parallel 2
          ctest --test-dir build/ci-logic --output-on-failure

      - name: Run scoped clang-tidy
        run: >-
          "$CLANG_TIDY" --warnings-as-errors='*' --config-file=.clang-tidy $PURE_TIDY_FILES
          -- -std=c++23 -Iinclude

      - name: Check for matching Hyprland headers
        id: hyprland-headers
        run: |
          if pkg-config --exists hyprland; then
            version="$(pkg-config --modversion hyprland)"
          else
            version=""
          fi

          if [ "$version" = "0.55.2" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Hyprland $version headers are available; running full plugin build."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Full plugin build skipped::Hyprland 0.55.2 headers/pkg-config are not available on ubuntu-24.04. Full plugin builds are validated locally against matching Hyprland headers."
          fi

      - name: Build full plugin when matching headers exist
        if: steps.hyprland-headers.outputs.available == 'true'
        run: |
          cmake -S . -B build/ci-full -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci-full
          ctest --test-dir build/ci-full --output-on-failure
